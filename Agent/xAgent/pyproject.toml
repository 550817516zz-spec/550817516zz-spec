[project]
name = "xagent"
version = "0.1.0"
description = "模块化 LLM Agent：core 业务内核与前端界面完全解耦"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.30",
    "textual>=0.60",
    "mcp>=1.8",
]

[project.scripts]
xagent = "main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["core*", "tui*", "web*", "desktop*", "mobile*"]

[tool.setuptools.package-data]
tui = ["*.tcss"]
